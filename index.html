<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>问答式报销记录</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">Reimbursement Wizard</p>
      <h1>问答式报销记录</h1>
      <p class="subtitle">一次只回答一个问题，自动保存到浏览器，最后导出 Excel，用 Excel 打开即可整理报销。</p>
    </section>

    <section class="card" id="wizard-card">
      <div class="progress-row">
        <span id="step-label">第 1 步</span>
        <span id="progress-label">1 / 5</span>
      </div>
      <div class="progress-bar" aria-hidden="true">
        <div id="progress-fill"></div>
      </div>

      <h2 id="question-title">金额</h2>
      <p id="question-help" class="question-help"></p>
      <div id="answer-area" class="answer-area"></div>

      <div class="button-row">
        <button id="back-btn" class="secondary" type="button">上一步</button>
        <button id="next-btn" class="primary" type="button">下一步</button>
      </div>
    </section>

    <section class="card actions-card">
      <h2>记录管理</h2>
      <div class="action-grid">
        <button id="new-record-btn" type="button">新增一笔</button>
        <button id="toggle-records-btn" type="button">查看全部记录</button>
        <button id="export-btn" type="button">导出 Excel</button>
        <button id="clear-btn" class="danger" type="button">清空全部记录</button>
      </div>
      <p class="small-note">说明：记录保存在当前浏览器里。别人打开链接填写时，数据会保存在他自己的浏览器中，需要他导出 Excel 发给你。</p>
    </section>

    <section class="card" id="summary-card">
      <h2>按费用类别汇总</h2>
      <div id="summary-list" class="summary-list"></div>
    </section>

    <section class="card hidden" id="records-card">
      <h2>全部记录</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>金额</th>
              <th>费用类别</th>
              <th>用途/商户</th>
              <th>发票类别</th>
              <th>备注/事由</th>
              <th>申请人</th>
              <th>报销日期</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="records-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js?v=20261023-excel1"></script>
</body>
</html>
